spring.web.resources.static-locations=classpath:/static/,file:src/main/webapp/

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/camplus_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:Camplus_sql}
spring.datasource.password=${DB_PASSWORD:123456}

mybatis.config-location=classpath:mybatis/mybatis-config.xml
mybatis.mapper-locations=classpath:mybatis/mappers/*.xml
mybatis.type-aliases-package=com.camplus.login.entity

bge-m3.model-path=D:/models/bge-m3-onnx/
bge-m3.dense-weight=0.6
bge-m3.sparse-weight=0.4

ollama.base-url=http://localhost:11434
ollama.chat-model-name=qwen2.5:7b
ollama.temperature=0.7
