<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贡献 - Camplus</title>
    <link rel="stylesheet" href="./css/contribution.css">
    <link rel="stylesheet" href="../components/menu.css">
    <link rel="stylesheet" href="../components/toast.css">
</head>
<body>
<!-- 音乐控制按钮 -->
<div class="music-button" id="musicButton">
    <svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
        <line class="music-slash" x1="4" y1="4" x2="20" y2="20" stroke-width="3" style="display: none;"></line>
    </svg>
</div>

<!-- 菜单按钮 -->
<div class="menu-button" id="menuButton">
    <img src="../assets/icons/menuIcon.svg" alt="菜单" class="menu-icon">
</div>

<!-- 背景音乐 -->
<audio id="bgMusic" loop>
    <source src="../assets/musics/webbgm.mp3" type="audio/mpeg">
</audio></audio>

<!-- 背景容器 -->
<div class="background-container">
    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>
    <div class="dot dot4"></div>
    <div class="dot dot5"></div>
    <div class="dot dot6"></div>
    <div class="dot dot7"></div>
    <div class="dot dot8"></div>
    <div class="dot dot9"></div>
    <div class="dot dot10"></div>
    <div class="dot dot11"></div>
    <div class="dot dot12"></div>
</div>

<!-- 侧边菜单 -->
<div class="side-menu" id="sideMenu">
    <div class="menu-header">
        <div class="account-area" id="accountArea">
            <div class="avatar-circle" id="avatarCircle">
                <svg class="avatar-icon avatar-icon--user" id="avatarIconUser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <svg class="avatar-icon avatar-icon--smile" id="avatarIconSmile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
            </div>
            <div class="account-info">
                <span class="account-name" id="accountName">请先登录</span>
                <span class="account-email" id="accountEmail"></span>
            </div>
        </div>
    </div>
    <div class="menu-content">
        <a class="menu-item menu-item--bright" href="../qa/qa.html">
            <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <span>问答平台</span>
        </a>
        <a class="menu-item menu-item--bright" href="../home/index.html">
            <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>首页</span>
        </a>
        <a class="menu-item menu-item--bright" id="adminMenuItem" href="../admin/admin.html">
            <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
            <span>管理者</span>
        </a>
        <a class="menu-item menu-item--bright" href="contribution.html">
            <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span>贡献</span>
        </a>
    </div>
</div>

<!-- 主体内容区域 -->
<main class="layout">
    <!-- 侧边导航栏 -->
    <aside class="sidebar">
        <nav class="nav">
            <button class="nav-item active" data-panel="submitPanel">提交贡献</button>
            <button class="nav-item" data-panel="myPanel">我的贡献</button>
        </nav>
    </aside>

    <!-- 主内容区 -->
    <section class="content">
        <!-- 提交贡献面板 -->
        <div class="panel active" id="submitPanel">
            <div class="section-head">
                <div>
                    <p class="eyebrow">Contribution</p>
                    <h2>提交新贡献</h2>
                </div>
                <div class="hint">支持文本、图片、链接等多种类型</div>
            </div>

            <form class="form-grid" id="submitForm">
                <label>
                    贡献标题
                    <input type="text" name="title" placeholder="输入贡献标题" required>
                </label>
                <label>
                    贡献类型
                    <select name="type" required>
                        <option value="" disabled selected>选择类型</option>
                        <option value="text">文本内容</option>
                        <option value="image">图片资源</option>
                        <option value="link">链接分享</option>
                        <option value="other">其他</option>
                    </select>
                </label>
                <label class="wide">
                    贡献内容
                    <textarea name="content" rows="6" placeholder="详细描述您的贡献内容..." required></textarea>
                </label>
                <div class="form-actions">
                    <button type="submit" class="submit-btn">提交贡献</button>
                </div>
            </form>
        </div>

        <!-- 我的贡献面板 -->
        <div class="panel" id="myPanel">
            <div class="section-head">
                <div>
                    <p class="eyebrow">My Contributions</p>
                    <h2>我的贡献</h2>
                </div>
                <div class="filter-group">
                    <select id="statusFilter">
                        <option value="all">全部状态</option>
                        <option value="pending">待审核</option>
                        <option value="approved">已通过</option>
                        <option value="rejected">已拒绝</option>
                    </select>
                </div>
            </div>

            <div id="contributionList">
                <!-- 贡献列表将通过 JS 动态生成 -->
                <div class="empty-state">
                    <p>暂无贡献记录</p>
                </div>
            </div>

            <nav class="pagination">
                <button type="button" class="secondary" id="previousPage">上一页</button>
                <span id="pageInfo">第 1 页 / 共 1 页</span>
                <button type="button" class="secondary" id="nextPage">下一页</button>
            </nav>
        </div>
    </section>
</main>

<dialog class="detail-dialog" id="contributionDialog" aria-labelledby="dialogTitle">
    <div class="dialog-shell">
        <header class="dialog-head">
            <div>
                <p class="eyebrow">Contribution</p>
                <h2 id="dialogTitle">贡献详情</h2>
            </div>
            <button type="button" class="icon-button" id="closeDialog" aria-label="关闭贡献详情">×</button>
        </header>

        <section id="detailView">
            <div class="detail-meta">
                <span class="badge" id="detailStatus">未知状态</span>
                <span id="detailType">未知类型</span>
                <span id="detailCreateTime">-</span>
            </div>
            <div class="detail-block">
                <h3 id="detailTitle">-</h3>
                <p id="detailContent">-</p>
            </div>
            <div class="review-block" id="reviewBlock" hidden>
                <h3>管理员拒绝原因</h3>
                <p id="reviewComment">管理员未填写拒绝原因</p>
            </div>
            <div class="dialog-actions">
                <button type="button" id="editContribution" hidden>修改贡献</button>
            </div>
        </section>

        <form class="form-grid" id="editContributionForm" hidden>
            <label>
                贡献标题
                <input type="text" name="title" id="editTitle" required>
            </label>
            <label>
                贡献类型
                <select name="type" id="editType" required>
                    <option value="text">文本内容</option>
                    <option value="image">图片资源</option>
                    <option value="link">链接分享</option>
                    <option value="other">其他</option>
                </select>
            </label>
            <label class="wide">
                贡献内容
                <textarea name="content" rows="6" id="editContent" required></textarea>
            </label>
            <div class="form-actions">
                <button type="button" class="secondary" id="cancelEdit">取消</button>
                <button type="submit" class="submit-btn">保存修改</button>
            </div>
        </form>
    </div>
</dialog>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../components/toast.js"></script>
<script src="../components/menu.js"></script>
<script src="./js/contribution.js"></script>
</body>
</html>
