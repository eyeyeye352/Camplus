<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户信息</title>
    <link rel="stylesheet" href="userInfo.css">
</head>
<body>
<div class="back-home">
        <a href="../home/index.html">← 返回首页</a>
    </div>

    <div class="user-info-container">
        <h1>个人信息</h1>

    <div class="info-section">
        <h2>基本信息</h2>
        <div class="info-row">
            <span class="info-label">用户名：</span>
            <span class="info-value" id="usernameValue"></span>
        </div>
        <div class="info-row">
            <span class="info-label">邮箱：</span>
            <span class="info-value" id="emailValue"></span>
        </div>
        <div class="info-row">
            <span class="info-label">手机号：</span>
            <span class="info-value" id="phoneValue"></span>
        </div>
        <div class="info-row">
            <span class="info-label">身份：</span>
            <span class="info-value" id="roleValue"></span>
        </div>
    </div>

    <div class="edit-section">
        <h2>修改信息</h2>

        <form id="editUsernameForm">
            <label for="newUsername">新用户名：</label>
            <input type="text" id="newUsername" name="newUsername" required>
            <button type="submit">修改用户名</button>
        </form>

        <form id="editPasswordForm">
            <label for="oldPassword">原密码：</label>
            <input type="password" id="oldPassword" name="oldPassword" required>
            <label for="newPassword">新密码：</label>
            <input type="password" id="newPassword" name="newPassword" required>
            <button type="submit">修改密码</button>
        </form>

        <form id="editEmailForm">
            <label for="newEmail">新邮箱：</label>
            <input type="email" id="newEmail" name="newEmail" required>
            <button type="submit">修改邮箱</button>
        </form>

        <form id="editPhoneForm">
            <label for="newPhone">新手机号：</label>
            <input type="tel" id="newPhone" name="newPhone" required>
            <button type="submit">修改手机号</button>
        </form>
    </div>
</div>

<script src="userInfo.js"></script>
</body>
</html>
