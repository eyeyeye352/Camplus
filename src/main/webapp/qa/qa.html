<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camplus · 智能问答</title>

    <style>
        /* ===== reset & base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        @font-face {
            font-family: 'Camplus_title';
            src: url('../assets/fonts/Camplus标题字体.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 50%, #1a1a1a 100%);
        }

        /* ===== 动态背景 · 浮动圆点 (与登录页完全一致) ===== */
        .background-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none;
        }
        .dot {
            position: absolute; background-color: #fff;
            border-radius: 50%; opacity: 0.6;
        }
        .dot1 { width: 8px; height: 8px; top: 15%; left: 10%; animation: float1 15s ease-in-out infinite; }
        .dot2 { width: 12px; height: 12px; top: 25%; left: 25%; animation: float2 12s ease-in-out infinite; }
        .dot3 { width: 6px; height: 6px; top: 35%; left: 40%; animation: float3 18s ease-in-out infinite; }
        .dot4 { width: 10px; height: 10px; top: 20%; left: 55%; animation: float4 14s ease-in-out infinite; }
        .dot5 { width: 7px; height: 7px; top: 45%; left: 20%; animation: float5 16s ease-in-out infinite; }
        .dot6 { width: 9px; height: 9px; top: 55%; left: 35%; animation: float6 13s ease-in-out infinite; }
        .dot7 { width: 11px; height: 11px; bottom: 20%; right: 15%; animation: float7 17s ease-in-out infinite; }
        .dot8 { width: 8px; height: 8px; bottom: 35%; right: 30%; animation: float8 11s ease-in-out infinite; }
        .dot9 { width: 13px; height: 13px; bottom: 25%; right: 45%; animation: float9 19s ease-in-out infinite; }
        .dot10 { width: 7px; height: 7px; bottom: 50%; right: 20%; animation: float10 15s ease-in-out infinite; }
        .dot11 { width: 10px; height: 10px; bottom: 40%; right: 55%; animation: float11 14s ease-in-out infinite; }
        .dot12 { width: 6px; height: 6px; bottom: 60%; right: 35%; animation: float12 16s ease-in-out infinite; }

        @keyframes float1 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(30px, 20px) scale(1.1); } 50% { transform: translate(0, 40px) scale(0.9); } 75% { transform: translate(-30px, 20px) scale(1.05); } }
        @keyframes float2 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-25px, 30px) scale(0.9); } 50% { transform: translate(-40px, 0) scale(1.1); } 75% { transform: translate(-20px, -25px) scale(0.95); } }
        @keyframes float3 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(20px, -25px) scale(1.05); } 50% { transform: translate(40px, 0) scale(0.9); } 75% { transform: translate(20px, 30px) scale(1.1); } }
        @keyframes float4 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-35px, 15px) scale(0.95); } 50% { transform: translate(0, -30px) scale(1.05); } 75% { transform: translate(35px, 10px) scale(1); } }
        @keyframes float5 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(25px, -20px) scale(1.1); } 50% { transform: translate(10px, -40px) scale(0.9); } 75% { transform: translate(-15px, -15px) scale(1.05); } }
        @keyframes float6 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-20px, 25px) scale(0.9); } 50% { transform: translate(-35px, 10px) scale(1.1); } 75% { transform: translate(-10px, -15px) scale(0.95); } }
        @keyframes float7 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-30px, -20px) scale(1.1); } 50% { transform: translate(0, -40px) scale(0.9); } 75% { transform: translate(30px, -25px) scale(1.05); } }
        @keyframes float8 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(40px, -30px) scale(0.95); } 50% { transform: translate(20px, 0) scale(1.05); } 75% { transform: translate(0, 25px) scale(1); } }
        @keyframes float9 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-20px, 30px) scale(1.1); } 50% { transform: translate(-40px, 10px) scale(0.9); } 75% { transform: translate(-25px, -20px) scale(1.05); } }
        @keyframes float10 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(30px, 25px) scale(0.9); } 50% { transform: translate(15px, 40px) scale(1.1); } 75% { transform: translate(-10px, 20px) scale(0.95); } }
        @keyframes float11 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-25px, -20px) scale(1.05); } 50% { transform: translate(-10px, -35px) scale(0.9); } 75% { transform: translate(15px, -15px) scale(1.1); } }
        @keyframes float12 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(20px, 20px) scale(0.95); } 50% { transform: translate(35px, 5px) scale(1.05); } 75% { transform: translate(20px, -10px) scale(1); } }

        /* ===== 全局功能按钮 ===== */
        .menu-button, .music-button {
            position: fixed; top: 20px; z-index: 100000;
            cursor: pointer; opacity: 0.5;
            transition: opacity 0.3s ease, transform 0.1s ease;
        }
        .menu-button { right: 20px; }
        .music-button { right: 80px; }
        .menu-button:hover, .music-button:hover { opacity: 1; }
        .menu-button:active, .music-button:active { opacity: 0.5; transform: scale(0.95); }
        .menu-icon, .music-icon { width: 40px; height: 40px; }
        .menu-icon { filter: brightness(0) invert(1); }
        .music-icon { color: #ffffff; }
        .music-slash { stroke: #ff4d4d; }

        /* ===== 侧边菜单 & 遮罩 ===== */
        .menu-overlay {
            position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.5);
            z-index: 99998; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .menu-overlay.active { opacity: 1; pointer-events: auto; }

        .side-menu {
            position: fixed; top: 0; right: 0; width: 280px; height: 100vh;
            background-color: #0a0a0a; z-index: 99999; padding-top: 80px;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
            border-radius: 20px 0 0 20px;
        }
        .side-menu.active { opacity: 1; pointer-events: auto; }

        .border-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 20px 0 0 20px; }
        .border-gradient {
            position: absolute; inset: 0;
            background: linear-gradient(45deg, #ff0080, #ff8c00, #40e0d0, #8a2be2, #ff0080);
            background-size: 400% 400%; animation: gradientRotate 4s ease infinite;
            opacity: 0.8; border-radius: 20px 0 0 20px; filter: blur(4px);
        }
        @keyframes gradientRotate { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .border-inner { position: absolute; top: 3px; left: 3px; right: 0; bottom: 3px; background-color: #0a0a0a; border-radius: 17px 0 0 17px; }

        .menu-content { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 20px; }
        .menu-item {
            display: block; padding: 20px 10px; font-size: 14px; color: #ffffff;
            text-decoration: none; background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; text-align: center;
            transition: all 0.2s ease;
        }
        .menu-item:hover { background-color: rgba(255, 0, 128, 0.2); border-color: rgba(255, 0, 128, 0.5); color: #ff0080; transform: translateY(-2px); }
        .menu-item.current-page { background-color: rgba(255, 0, 128, 0.15); border-color: rgba(255, 0, 128, 0.4); color: #ff0080; pointer-events: none; }

        .menu-footer { position: absolute; bottom: 30px; left: 20px; right: 20px; z-index: 1; text-align: center; }
        .menu-login-btn { background: none; border: none; color: #ffffff; font-size: 14px; cursor: pointer; opacity: 0.8; transition: opacity 0.2s ease; }
        .menu-login-btn:hover { opacity: 1; text-decoration: underline; }

        /* ===== 聊天问答面板 (继承自登录框质感) ===== */
        .chat-layout {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 900px; height: 85vh;
            background: #0a0a0a; /* 核心黑底 */
            border-radius: 16px;
            box-shadow: 0 0 30px 15px rgba(26, 26, 26, 0.8), 0 0 60px 30px rgba(26, 26, 26, 0.4); /* 标志性阴影 */
            display: flex; flex-direction: column; overflow: hidden;
            z-index: 10;
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -48%); } to { opacity: 1; transform: translate(-50%, -50%); } }

        .chat-header {
            padding: 20px 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 15px;
            background-color: rgba(255, 255, 255, 0.02);
        }
        .chat-avatar {
            width: 45px; height: 45px;
            background: linear-gradient(45deg, #ff0080, #ff8c00);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; box-shadow: 0 0 15px rgba(255, 0, 128, 0.3);
        }
        .chat-title-group { display: flex; flex-direction: column; gap: 5px; }
        .chat-title { color: #ffffff; font-size: 18px; font-weight: 600; font-family: 'Camplus_title', sans-serif; letter-spacing: 1px; }
        .chat-status { color: #40e0d0; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .status-dot {
            width: 8px; height: 8px; background-color: #40e0d0; border-radius: 50%;
            box-shadow: 0 0 8px #40e0d0; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(64, 224, 208, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(64, 224, 208, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(64, 224, 208, 0); }
        }

        .chat-messages {
            flex: 1; padding: 30px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        .message-row { display: flex; width: 100%; }
        .message-row.bot { justify-content: flex-start; }
        .message-row.user { justify-content: flex-end; }

        .bubble {
            max-width: 80%; padding: 15px 20px;
            font-size: 15px; line-height: 1.6; letter-spacing: 0.5px;
        }
        .bubble.bot {
            background-color: rgba(255, 255, 255, 0.05); color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px 16px 16px 4px;
        }
        .bubble.user {
            background: linear-gradient(45deg, #ff0080, #ff8c00); color: #ffffff;
            border-radius: 16px 16px 4px 16px;
            box-shadow: 0 5px 15px rgba(255, 0, 128, 0.2);
        }

        /* 输入区：复刻 login-input 质感 */
        .chat-input-container {
            padding: 25px 30px; border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; gap: 20px; align-items: center;
            background-color: rgba(255, 255, 255, 0.02);
        }
        .chat-input {
            flex: 1; background: transparent; border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5); /* 标志性底边框 */
            color: #fff; font-size: 16px; padding: 10px 0;
            outline: none; transition: border-color 0.2s;
        }
        .chat-input:focus { border-bottom-color: rgba(255, 255, 255, 1); }
        .chat-input::placeholder { color: rgba(255, 255, 255, 0.3); }

        .send-btn {
            padding: 12px 25px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            background: linear-gradient(45deg, #ff0080, #ff8c00); color: #fff;
            transition: transform 0.2s, opacity 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); opacity: 0.8; }
        .send-btn svg { width: 18px; height: 18px; }
    </style>
</head>
<body>

<!-- ===== 动态背景 ===== -->
<div class="background-container">
    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>
    <div class="dot dot4"></div>
    <div class="dot dot5"></div>
    <div class="dot dot6"></div>
    <div class="dot dot7"></div>
    <div class="dot dot8"></div>
    <div class="dot dot9"></div>
    <div class="dot dot10"></div>
    <div class="dot dot11"></div>
    <div class="dot dot12"></div>
</div>

<!-- ===== 音乐按钮 ===== -->
<div class="music-button" id="musicButton">
    <svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
        <line class="music-slash" x1="4" y1="4" x2="20" y2="20" stroke-width="3" style="display: none;"></line>
    </svg>
</div>

<!-- ===== 菜单按钮 ===== -->
<div class="menu-button" id="menuButton">
    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
</div>

<!-- ===== 背景音乐 ===== -->
<audio id="bgMusic" loop>
    <source src="../assets/musics/webbgm.mp3" type="audio/mpeg" />
</audio>

<!-- ===== 遮罩层 ===== -->
<div class="menu-overlay" id="menuOverlay"></div>

<!-- ===== 侧边菜单 ===== -->
<div class="side-menu" id="sideMenu">
    <div class="border-container">
        <div class="border-gradient"></div>
        <div class="border-inner"></div>
    </div>
    <div class="menu-content">
        <a class="menu-item current-page" href="../qna/qna.html">问答平台</a>
        <a class="menu-item" href="../home/index.html">首页</a>
        <a class="menu-item" href="../userInfo/userInfo.html">用户</a>
        <a class="menu-item" id="adminMenuItem" href="../admin/admin.html">管理者入口</a>
        <a class="menu-item" href="../help/help.html">帮助</a>
        <a class="menu-item" href="../contribution/contribution.html">用户贡献</a>
    </div>
    <div class="menu-footer">
        <button class="menu-login-btn" id="menuLoginBtn">登入 / 注册</button>
    </div>
</div>

<!-- ===== 聊天主体面板 ===== -->
<div class="chat-layout">

    <!-- 头部 -->
    <div class="chat-header">
        <div class="chat-avatar">✨</div>
        <div class="chat-title-group">
            <span class="chat-title">Camplus 校园智能助手</span>
            <span class="chat-status">
                    <div class="status-dot"></div>
                    知识库连接就绪 [本地架构]
                </span>
        </div>
    </div>

    <!-- 消息区 -->
    <div class="chat-messages" id="chatBox">
        <div class="message-row bot">
            <div class="bubble bot">
                您好！欢迎使用 Camplus 专属问答助手。<br>
                我目前基于完全本地化的 RAG 架构运行，您可以随时向我提问校园相关的信息。
            </div>
        </div>
    </div>

    <!-- 输入区 -->
    <div class="chat-input-container">
        <input type="text" id="chatInput" class="chat-input" placeholder="输入你想咨询的问题..." autocomplete="off">
        <button class="send-btn" id="sendBtn">
            发送
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>

</div>

<!-- ===== 交互脚本 ===== -->
<script>
    (function() {
        'use strict';

        // ---------- DOM 引用 ----------
        const menuButton = document.getElementById('menuButton');
        const sideMenu = document.getElementById('sideMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const musicButton = document.getElementById('musicButton');
        const bgMusic = document.getElementById('bgMusic');
        const menuLoginBtn = document.getElementById('menuLoginBtn');
        const adminMenuItem = document.getElementById('adminMenuItem');

        // ---------- 用户状态逻辑 (复用 Login/UserInfo) ----------
        const username = sessionStorage.getItem('username');
        if (username) {
            menuLoginBtn.textContent = username;
            menuLoginBtn.style.pointerEvents = 'none';
        } else {
            menuLoginBtn.addEventListener('click', () => {
                window.location.href = '../login/login.html';
            });
        }

        adminMenuItem.addEventListener('click', (e) => {
            if (!username) {
                e.preventDefault();
                alert('请先登录');
                window.location.href = '../login/login.html';
            }
        });

        // ---------- 音乐控制 ----------
        let isMusicPlaying = false;
        const musicSlash = document.querySelector('.music-slash');

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicSlash.style.display = '';
                musicButton.style.opacity = '0.5';
            } else {
                bgMusic.play().then(() => {
                    musicSlash.style.display = 'none';
                    musicButton.style.opacity = '1';
                }).catch(err => console.log('需要用户交互', err));
            }
            isMusicPlaying = !isMusicPlaying;
        }

        musicButton.addEventListener('click', toggleMusic);

        // 首次点击页面任意位置尝试播放
        document.body.addEventListener('click', function playMusicOnFirstClick() {
            if (!isMusicPlaying) {
                bgMusic.play().then(() => {
                    musicSlash.style.display = 'none';
                    musicButton.style.opacity = '1';
                    isMusicPlaying = true;
                }).catch(err => console.log('需要用户交互', err));
            }
            document.body.removeEventListener('click', playMusicOnFirstClick);
        }, { once: true });

        // ---------- 侧边菜单 ----------
        menuButton.addEventListener('click', () => {
            sideMenu.classList.add('active');
            menuOverlay.classList.add('active');
        });

        menuOverlay.addEventListener('click', () => {
            sideMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
        });

        // ---------- 问答核心逻辑 ----------
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(text, sender) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            const bubble = document.createElement('div');
            bubble.className = `bubble ${sender}`;
            bubble.innerHTML = text; // 支持换行

            row.appendChild(bubble);
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;

            // 1. 追加用户消息
            appendMessage(text, 'user');
            chatInput.value = '';

            // 2. 模拟系统加载中
            setTimeout(() => {
                appendMessage("<span style='opacity:0.6'>正在检索本地知识库...</span>", 'bot');

                // 3. 模拟大模型回复 (后续请替换为真实 Axios 请求后端 API)
                setTimeout(() => {
                    chatBox.removeChild(chatBox.lastChild); // 移除加载中提示

                    if (text.includes("饭堂")) {
                        appendMessage("根据本地知识库：我们学校一共有三个饭堂，分别是一号饭堂、二号饭堂和三号饭堂。", 'bot');
                    } else {
                        appendMessage("我没有在本地知识库中找到相关信息，您可以尝试联系管理人员补充相关文档。", 'bot');
                    }
                }, 800);
            }, 300);
        }

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

    })();
</script>

</body>
</html>
