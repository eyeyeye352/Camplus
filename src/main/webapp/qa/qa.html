<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camplus · 智能问答</title>
    <link rel="stylesheet" href="../components/menu.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 50%, #1a1a1a 100%); }
        .background-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
        .dot { position: absolute; background-color: #fff; border-radius: 50%; opacity: 0.6; }
        .dot1 { width: 8px; height: 8px; top: 15%; left: 10%; animation: float1 15s ease-in-out infinite; }
        .dot2 { width: 12px; height: 12px; top: 25%; left: 25%; animation: float2 12s ease-in-out infinite; }
        .dot3 { width: 6px; height: 6px; top: 35%; left: 40%; animation: float3 18s ease-in-out infinite; }
        .dot4 { width: 10px; height: 10px; top: 20%; left: 55%; animation: float4 14s ease-in-out infinite; }
        .dot5 { width: 7px; height: 7px; top: 45%; left: 20%; animation: float5 16s ease-in-out infinite; }
        .dot6 { width: 9px; height: 9px; top: 55%; left: 35%; animation: float6 13s ease-in-out infinite; }
        .dot7 { width: 11px; height: 11px; bottom: 20%; right: 15%; animation: float7 17s ease-in-out infinite; }
        .dot8 { width: 8px; height: 8px; bottom: 35%; right: 30%; animation: float8 11s ease-in-out infinite; }
        .dot9 { width: 13px; height: 13px; bottom: 25%; right: 45%; animation: float9 19s ease-in-out infinite; }
        .dot10 { width: 7px; height: 7px; bottom: 50%; right: 20%; animation: float10 15s ease-in-out infinite; }
        .dot11 { width: 10px; height: 10px; bottom: 40%; right: 55%; animation: float11 14s ease-in-out infinite; }
        .dot12 { width: 6px; height: 6px; bottom: 60%; right: 35%; animation: float12 16s ease-in-out infinite; }
        @keyframes float1 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(30px, 20px) scale(1.1); } 50% { transform: translate(0, 40px) scale(0.9); } 75% { transform: translate(-30px, 20px) scale(1.05); } }
        @keyframes float2 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-25px, 30px) scale(0.9); } 50% { transform: translate(-40px, 0) scale(1.1); } 75% { transform: translate(-20px, -25px) scale(0.95); } }
        @keyframes float3 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(20px, -25px) scale(1.05); } 50% { transform: translate(40px, 0) scale(0.9); } 75% { transform: translate(20px, 30px) scale(1.1); } }
        @keyframes float4 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-35px, 15px) scale(0.95); } 50% { transform: translate(0, -30px) scale(1.05); } 75% { transform: translate(35px, 10px) scale(1); } }
        @keyframes float5 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(25px, -20px) scale(1.1); } 50% { transform: translate(10px, -40px) scale(0.9); } 75% { transform: translate(-15px, -15px) scale(1.05); } }
        @keyframes float6 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-20px, 25px) scale(0.9); } 50% { transform: translate(-35px, 10px) scale(1.1); } 75% { transform: translate(-10px, -15px) scale(0.95); } }
        @keyframes float7 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-30px, -20px) scale(1.1); } 50% { transform: translate(0, -40px) scale(0.9); } 75% { transform: translate(30px, -25px) scale(1.05); } }
        @keyframes float8 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(40px, -30px) scale(0.95); } 50% { transform: translate(20px, 0) scale(1.05); } 75% { transform: translate(0, 25px) scale(1); } }
        @keyframes float9 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-20px, 30px) scale(1.1); } 50% { transform: translate(-40px, 10px) scale(0.9); } 75% { transform: translate(-25px, -20px) scale(1.05); } }
        @keyframes float10 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(30px, 25px) scale(0.9); } 50% { transform: translate(15px, 40px) scale(1.1); } 75% { transform: translate(-10px, 20px) scale(0.95); } }
        @keyframes float11 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-25px, -20px) scale(1.05); } 50% { transform: translate(-10px, -35px) scale(0.9); } 75% { transform: translate(15px, -15px) scale(1.1); } }
        @keyframes float12 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(20px, 20px) scale(0.95); } 50% { transform: translate(35px, 5px) scale(1.05); } 75% { transform: translate(20px, -10px) scale(1); } }
        .chat-layout { position: absolute; top: 50%; left: 50%; width: 90%; max-width: 900px; height: 85vh; margin-top: -42.5vh; margin-left: -45%; background: #0a0a0a; border-radius: 16px; box-shadow: 0 0 30px 15px rgba(26, 26, 26, 0.8), 0 0 60px 30px rgba(26, 26, 26, 0.4); display: flex; flex-direction: column; overflow: hidden; z-index: 10; }
        .chat-header { padding: 20px 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; background-color: rgba(255, 255, 255, 0.02); }
        .chat-title-group { display: flex; flex-direction: column; gap: 5px; }
        .chat-title { color: #ffffff; font-size: 18px; font-weight: 600; letter-spacing: 1px; }
        .chat-messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        .message-row { display: flex; width: 100%; }
        .message-row.bot { justify-content: flex-start; }
        .message-row.user { justify-content: flex-end; }
        .bubble { max-width: 80%; padding: 15px 20px; font-size: 15px; line-height: 1.6; letter-spacing: 0.5px; }
        .bubble.bot { background-color: rgba(255, 255, 255, 0.05); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px 16px 16px 4px; }
        .bubble.user { background: linear-gradient(45deg, #46b4dc, #0077b6); color: #ffffff; border-radius: 16px 16px 4px 16px; box-shadow: 0 5px 15px rgba(70, 180, 220, 0.2); }
        .chat-input-container { padding: 25px 30px; border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; gap: 20px; align-items: center; background-color: rgba(255, 255, 255, 0.02); }
        .chat-input { flex: 1; background: transparent; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.5); color: #fff; font-size: 16px; padding: 10px 0; outline: none; transition: border-color 0.2s; }
        .chat-input:focus { border-bottom-color: rgba(70, 180, 220, 1); }
        .chat-input::placeholder { color: rgba(255, 255, 255, 0.3); }
        .send-btn { padding: 12px 25px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; background: linear-gradient(45deg, #46b4dc, #0077b6); color: #fff; transition: transform 0.2s, opacity 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); opacity: 0.8; }
        .send-btn svg { width: 18px; height: 18px; }
    </style>
</head>
<body>
<div class="music-button" id="musicButton"><svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle><line class="music-slash" x1="4" y1="4" x2="20" y2="20" stroke-width="3" style="display: none;"></line></svg></div>
<div class="menu-button" id="menuButton"><img src="../assets/icons/menuIcon.svg" alt="菜单" class="menu-icon"></div>
<audio id="bgMusic" loop><source src="../assets/musics/webbgm.mp3" type="audio/mpeg"></audio>
<div class="side-menu" id="sideMenu">
    <div class="menu-header">
        <div class="account-area" id="accountArea">
            <div class="avatar-circle" id="avatarCircle">
                <svg class="avatar-icon avatar-icon--user" id="avatarIconUser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <svg class="avatar-icon avatar-icon--smile" id="avatarIconSmile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
            </div>
            <div class="account-info"><span class="account-name" id="accountName">请先登录</span><span class="account-email" id="accountEmail"></span></div>
        </div>
    </div>
    <div class="menu-content">
        <a class="menu-item menu-item--bright" href="qa.html"><svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg><span>问答平台</span></a>
        <a class="menu-item menu-item--bright" href="../home/index.html"><svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>首页</span></a>
        <a class="menu-item menu-item--bright" id="adminMenuItem" href="../admin/admin.html"><svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg><span>管理者</span></a>
        <a class="menu-item menu-item--bright" href="../contribution/contribution.html"><svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg><span>贡献</span></a>
    </div>
</div>
<div class="background-container"><div class="dot dot1"></div><div class="dot dot2"></div><div class="dot dot3"></div><div class="dot dot4"></div><div class="dot dot5"></div><div class="dot dot6"></div><div class="dot dot7"></div><div class="dot dot8"></div><div class="dot dot9"></div><div class="dot dot10"></div><div class="dot dot11"></div><div class="dot dot12"></div></div>
<div class="chat-layout">
    <div class="chat-header"><div class="chat-title-group"><span class="chat-title">Camplus 校园智能助手</span></div></div>
    <div class="chat-messages" id="chatBox"><div class="message-row bot"><div class="bubble bot">欢迎使用 Camplus 校园问答助手。请问有什么可以帮助到你的。</div></div></div>
    <div class="chat-input-container">
        <input type="text" id="chatInput" class="chat-input" placeholder="输入你想咨询的问题..." autocomplete="off">
        <button class="send-btn" id="sendBtn">发送<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
    </div>
</div>
<script src="../components/menu.js"></script>
<script>
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    function appendMessage(text, sender) {
        const row = document.createElement('div');
        row.className = 'message-row ' + sender;
        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + sender;
        bubble.innerHTML = text;
        row.appendChild(bubble);
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    function handleSend() {
        const text = chatInput.value.trim();
        if (!text) return;
        appendMessage(text, 'user');
        chatInput.value = '';
        setTimeout(() => {
            appendMessage('<span style="opacity:0.6">正在检索本地知识库...</span>', 'bot');
            setTimeout(() => {
                chatBox.removeChild(chatBox.lastChild);
                if (text.includes('饭堂')) {
                    appendMessage('根据本地知识库：我们学校一共有三个饭堂，分别是一号饭堂、二号饭堂和三号饭堂。', 'bot');
                } else {
                    appendMessage('我没有在本地知识库中找到相关信息，您可以尝试联系管理人员补充相关文档。', 'bot');
                }
            }, 800);
        }, 300);
    }
    sendBtn.addEventListener('click', handleSend);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
</script>
</body>
</html>
