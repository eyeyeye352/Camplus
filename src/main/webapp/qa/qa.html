<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camplus 智能校园助手</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary-color: #4F46E5; /* 现代紫蓝色 */
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --chat-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --user-msg-bg: #4F46E5;
            --ai-msg-bg: #F3F4F6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #E0E7FF 0%, #EDE9FE 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        .chat-wrapper {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--chat-bg);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 头部设计 */
        .chat-header {
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #6EE7B7 0%, #3B82F6 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header-info h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .header-info p {
            margin: 4px 0 0;
            font-size: 0.875rem;
            color: #10B981; /* 绿色在线状态 */
            display: flex;
            align-items: center;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 0 2px #D1FAE5;
        }

        /* 聊天区域 */
        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 3px;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.ai {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 1rem;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* Markdown 样式重置 */
        .message-bubble p { margin: 0 0 8px 0; }
        .message-bubble p:last-child { margin: 0; }
        .message-bubble pre {
            background: #1F2937; color: #fff; padding: 10px;
            border-radius: 8px; overflow-x: auto; margin: 8px 0;
        }
        .message-bubble code { font-family: Consolas, Monaco, monospace; }
        .message-bubble ul, .message-bubble ol { margin: 8px 0; padding-left: 20px; }

        .user .message-bubble {
            background: var(--user-msg-bg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai .message-bubble {
            background: var(--ai-msg-bg);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        /* 打字机动画 */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 8px 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 输入区域 */
        .input-area {
            padding: 20px 24px;
            background: white;
            border-top: 1px solid #E5E7EB;
            display: flex;
            gap: 12px;
        }

        .input-box {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            background: #F9FAFB;
        }

        .input-box:focus {
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .send-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .send-btn:disabled {
            background: #9CA3AF;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<div class="chat-wrapper">
    <div class="chat-header">
        <div class="avatar">🎓</div>
        <div class="header-info">
            <h1>Camplus 校园智能助手</h1>
            <p><span class="status-dot"></span>本地知识库已连接</p>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message-row ai">
            <div class="message-bubble">
                你好！我是 Camplus 专属校园助手。<br>底层已接入纯本地化 RAG 架构（Qwen + BGE-M3），请问有什么我可以帮你的？
            </div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" class="input-box" id="userInput" placeholder="输入你想查询的校园规定或指南..." onkeypress="handleEnter(event)">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            发送
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
        </button>
    </div>
</div>

<script>
    // 你的 Spring Boot 本地 API 地址
    const API_URL = 'http://localhost:8080/api/qa/ask';

    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // 自动滚动到底部
    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 添加消息到面板
    function appendMessage(text, sender, isHtml = false) {
        const row = document.createElement('div');
        row.className = `message-row ${sender}`;

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';

        if (isHtml) {
            bubble.innerHTML = text; // 用于渲染 Markdown
        } else {
            bubble.innerText = text; // 用于纯文本
        }

        row.appendChild(bubble);
        chatBox.appendChild(row);
        scrollToBottom();
    }

    // 添加加载动画
    function addLoadingIndicator() {
        const row = document.createElement('div');
        row.className = 'message-row ai';
        row.id = 'loadingIndicator';

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerHTML = `
            <div class="typing-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        `;

        row.appendChild(bubble);
        chatBox.appendChild(row);
        scrollToBottom();
    }

    // 移除加载动画
    function removeLoadingIndicator() {
        const loading = document.getElementById('loadingIndicator');
        if (loading) {
            chatBox.removeChild(loading);
        }
    }

    async function sendMessage() {
        const question = userInput.value.trim();
        if (!question) return;

        // 1. 显示用户提问
        appendMessage(question, 'user');
        userInput.value = '';

        // 2. 锁定输入框，防止连点
        userInput.disabled = true;
        sendBtn.disabled = true;

        // 3. 显示优雅的加载动画
        addLoadingIndicator();

        try {
            // 4. 发起请求
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            });

            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

            const data = await response.json();

            // 5. 移除加载动画
            removeLoadingIndicator();

            // 6. 使用 marked.js 渲染后端返回的 Markdown 文本
            const answerText = data.answer || "未获取到答案字段";
            const htmlAnswer = marked.parse(answerText);

            appendMessage(htmlAnswer, 'ai', true);

        } catch (error) {
            console.error('请求失败:', error);
            removeLoadingIndicator();
            appendMessage('❌ 连接后端失败。请检查：<br>1. IDEA 中的后端服务是否正在运行<br>2. 跨域配置是否生效', 'ai', true);
        } finally {
            // 7. 解锁输入框
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    function handleEnter(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
