<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库配置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }
        .logo p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-group input::placeholder {
            color: #999;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-test {
            background: #f5f5f5;
            color: #333;
        }
        .btn-test:hover {
            background: #e8e8e8;
        }
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Camplus</h1>
            <p>数据库连接配置</p>
        </div>

        <form id="configForm">
            <div class="form-group">
                <label for="username">MySQL 用户名</label>
                <input type="text" id="username" placeholder="例如: root" value="root" required>
            </div>

            <div class="form-group">
                <label for="password">MySQL 密码</label>
                <input type="password" id="password" placeholder="输入您的MySQL密码">
            </div>

            <button type="button" class="btn btn-test" id="btnTest">测试连接</button>
            <button type="submit" class="btn btn-primary" id="btnSubmit">保存配置</button>
        </form>

        <div id="message" class="message"></div>

        <div class="footer">
            确保 MySQL 服务已启动，且数据库 camplus_db 已创建
        </div>
    </div>

    <script>
        const form = document.getElementById('configForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const btnTest = document.getElementById('btnTest');
        const btnSubmit = document.getElementById('btnSubmit');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }

        async function testConnection() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username) {
                showMessage('用户名不能为空', 'error');
                return;
            }

            btnTest.disabled = true;
            btnTest.textContent = '测试中...';

            try {
                const response = await fetch('/api/db/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message, 'success');
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            } finally {
                btnTest.disabled = false;
                btnTest.textContent = '测试连接';
            }
        }

        async function submitConfig() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username) {
                showMessage('用户名不能为空', 'error');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.textContent = '保存中...';

            try {
                const response = await fetch('/api/db/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = '/home/index.html';
                    }, 1500);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误: ' + error.message, 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = '保存配置';
            }
        }

        btnTest.addEventListener('click', testConnection);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            submitConfig();
        });

        async function checkStatus() {
            try {
                const response = await fetch('/api/db/status');
                const data = await response.json();
                if (data.connected) {
                    window.location.href = '/home/index.html';
                }
            } catch (error) {
                console.log('数据库未连接');
            }
        }

        checkStatus();
    </script>
</body>
</html>
