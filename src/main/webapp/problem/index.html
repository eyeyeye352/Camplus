<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Camplus · 固定问题查询</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { width: 100vw; min-height: 100vh; background-color: #1a1a1a; color: #fff; overflow-x: hidden; }
        
        /* 1. 背景光晕 (固定在角落) */
        .blob { position: fixed; width: 400px; height: 400px; background: radial-gradient(circle, rgba(255, 0, 128, 0.15), transparent 70%); filter: blur(60px); z-index: 0; pointer-events: none; }
        
        /* 2. 律动小白点 */
        .dot { position: fixed; width: 8px; height: 8px; background: rgba(255, 255, 255, 0.5); border-radius: 50%; z-index: 0; animation: float-around 8s infinite alternate ease-in-out; }
        @keyframes float-around { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 30px); } }

        .container { position: relative; z-index: 1; max-width: 700px; margin: 80px auto 0; padding: 0 20px; }
        .main-title { text-align: center; font-size: 32px; margin-bottom: 40px; color: #fff; }
        
        /* 搜索框 */
        .search-box { width: 100%; padding: 15px 20px; margin-bottom: 30px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; background: rgba(255, 255, 255, 0.05); color: #fff; outline: none; }
        .search-box:focus { border-color: #ff0080; }
        
        /* 列表卡片 */
        .faq-item { background: rgba(255, 255, 255, 0.03); margin-bottom: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .question { padding: 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #fff; }
        .question span { color: #ff0080; font-size: 13px; }
        .answer { padding: 0 18px 18px 18px; color: rgba(255, 255, 255, 0.6); line-height: 1.6; }
    </style>
</head>
<body>
    <div class="blob" style="top: -100px; left: -100px;"></div>
    <div class="blob" style="bottom: -100px; right: -100px;"></div>
    <div id="dot-container"></div>

    <div id="app" class="container">
        <h1 class="main-title">固定问题查询</h1>
        
        <input v-model="searchQuery" class="search-box" placeholder="搜索问题关键词...">
        
        <div v-for="(item, index) in filteredList" :key="index" class="faq-item">
            <div class="question" @click="item.show = !item.show">
                {{ item.question }}
                <span>{{ item.show ? '收起' : '展开' }}</span>
            </div>
            <div v-if="item.show" class="answer">{{ item.answer }}</div>
        </div>
    </div>

    <script>
        // 初始化背景装饰点
        const container = document.getElementById('dot-container');
        for(let i=0; i<8; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            const isLeft = i < 4;
            dot.style.left = isLeft ? (10 + Math.random() * 10) + 'vw' : (80 + Math.random() * 10) + 'vw';
            dot.style.top = (15 + Math.random() * 70) + 'vh';
            dot.style.animationDelay = (i * 1.2) + 's';
            container.appendChild(dot);
        }

        const { createApp } = Vue;
        createApp({
            data() { return { faqList: [], searchQuery: '' } },
            computed: {
                filteredList() {
                    return this.faqList.filter(item => 
                        item.question && item.question.toLowerCase().includes(this.searchQuery.toLowerCase())
                    );
                }
            },
            mounted() {
                // 解决重复显示：通过判断数组是否为空，确保只加载一次
                if (this.faqList.length > 0) return;

                axios.get('http://localhost:8080/faq?action=list&categoryId=1')
                    .then(res => {
                        // 使用 Map 去重，确保 question 唯一
                        const uniqueMap = new Map();
                        res.data.forEach(item => {
                            if (!uniqueMap.has(item.question)) {
                                uniqueMap.set(item.question, { ...item, show: false });
                            }
                        });
                        this.faqList = Array.from(uniqueMap.values());
                    })
                    .catch(err => {
                        console.error("加载数据失败，请确保后端已启动:", err);
                    });
            }
        }).mount('#app');
    </script>
</body>
</html>
