<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台 - Camplus</title>
    <link rel="stylesheet" href="../login/login.css">
    <link rel="stylesheet" href="../components/menu.css">
    <link rel="stylesheet" href="../components/toast.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="music-button" id="musicButton">
        <svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
            <line class="music-slash" x1="4" y1="4" x2="20" y2="20" stroke-width="3" style="display: none;"></line>
        </svg>
    </div>

    <div class="menu-button" id="menuButton">
        <img src="../assets/icons/menuIcon.svg" alt="菜单" class="menu-icon">
    </div>

    <audio id="bgMusic" loop>
        <source src="../assets/musics/webbgm.mp3" type="audio/mpeg">
    </audio>

    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <div class="account-area" id="accountArea">
                <div class="avatar-circle" id="avatarCircle">
                    <svg class="avatar-icon avatar-icon--user" id="avatarIconUser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <svg class="avatar-icon avatar-icon--smile" id="avatarIconSmile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                    </svg>
                </div>
                <div class="account-info">
                    <span class="account-name" id="accountName">请先登录</span>
                    <span class="account-email" id="accountEmail"></span>
                </div>
            </div>
        </div>
        <div class="menu-content">
            <a class="menu-item menu-item--bright" href="../qa/qa.html">
                <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
                <span>问答平台</span>
            </a>
            <a class="menu-item menu-item--bright" href="../home/index.html">
                <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>首页</span>
            </a>
            <a class="menu-item menu-item--bright" id="adminMenuItem" href="../admin/admin.html">
                <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <path d="M2 17l10 5 10-5"></path>
                    <path d="M2 12l10 5 10-5"></path>
                </svg>
                <span>管理者</span>
            </a>
            <a class="menu-item menu-item--bright" href="../contribution/contribution.html">
                <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
                <span>贡献</span>
            </a>
        </div>
    </div>

    <header class="admin-header">
        <div class="header-left">
            <div class="admin-title">CAMPLUS ADMIN</div>
            <span id="loginStatus" style="color: #40e0d0;">未登录</span>
        </div>
    </header>

    <aside class="admin-sidebar">
        <div class="admin-border-container">
            <div class="admin-border-gradient"></div>
            <div class="admin-border-inner"></div>
        </div>
        <div class="admin-menu-content">
            <div class="admin-menu-item active" onclick="switchView('review')" id="menuReview">
                📋 贡献审核
            </div>
            <div class="admin-menu-item" onclick="switchView('faq')" id="menuFaq">
                📝 FAQ管理
            </div>
            <div class="admin-menu-item" onclick="switchView('import')" id="menuImport">
                📚 知识导入
            </div>
            <div class="admin-menu-item" onclick="switchView('settings')" id="menuSettings">
                ⚙️ 管理员设置
            </div>
        </div>
    </aside>

    <main class="main-container">
        <div id="panelReview" class="admin-panel">
            <div class="glass-card">
                <div class="card-header">
                    <h2>贡献审核列表</h2>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <select id="reviewStatusFilter" onchange="fetchContributions()">
                            <option value="pending">待审核</option>
                            <option value="all">全部</option>
                        </select>
                        <button class="refresh-btn" onclick="fetchContributions()">🔄 刷新列表</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>提交用户</th>
                                <th>问题</th>
                                <th>状态</th>
                                <th>提交时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="contributionBody">
                            <tr><td colspan="6" style="text-align:center; color:rgba(255,255,255,0.4);">正在加载...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="panelFaq" class="admin-panel" style="display:none;">
            <div class="glass-card">
                <div class="card-header">
                    <h2>FAQ管理（按热度排序）</h2>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="faqSearchInput" placeholder="搜索问题..." onkeyup="handleFaqSearch(event)">
                        <button class="refresh-btn" onclick="fetchFaqList()">🔄 刷新列表</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>问题</th>
                                <th>热度分</th>
                                <th>提问次数</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="faqBody">
                            <tr><td colspan="6" style="text-align:center; color:rgba(255,255,255,0.4);">正在加载...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="panelImport" class="admin-panel" style="display:none;">
            <div class="glass-card">
                <div class="card-header">
                    <h2>知识库文件上传</h2>
                </div>
                <div class="import-container">
                    <div class="drop-zone" id="dropZone">
                        <div class="drop-icon">📁</div>
                        <div class="drop-text">将知识库文件拖拽到此处，或 <span>点击选择文件</span></div>
                        <div class="drop-hint">支持 .txt, .pdf, .docx 格式</div>
                    </div>
                    <input type="file" id="fileInput" style="display:none;" accept=".txt,.pdf,.docx" />
                    <div id="uploadResult" style="display:none;" class="upload-result">
                        <div id="selectedFileInfo"></div>
                        <button id="btnSubmitImport" style="margin-top:15px;" class="refresh-btn">开始导入</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="panelSettings" class="admin-panel" style="display:none;">
            <div class="glass-card">
                <div class="card-header">
                    <h2>管理员设置</h2>
                </div>
                
                <div style="margin-bottom: 30px;">
                    <h3 style="color: #40e0d0; margin-bottom: 15px;">📋 当前管理员列表</h3>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户名</th>
                                    <th>邮箱</th>
                                </tr>
                            </thead>
                            <tbody id="adminListBody">
                                <tr><td colspan="3" style="text-align:center; color:rgba(255,255,255,0.4);">正在加载...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div>
                    <h3 style="color: #40e0d0; margin-bottom: 15px;">➕ 添加管理员</h3>
                    <div class="form-group">
                        <label>输入普通用户账号：</label>
                        <input type="text" class="form-control" id="newAdminUsername" placeholder="输入要设为管理员的用户名">
                    </div>
                    <button class="refresh-btn" onclick="addAdmin()" style="margin-top: 15px;">设为管理员</button>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="reviewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>审核贡献 #<span id="modalContributionId">0</span></h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="reviewForm">
                <input type="hidden" id="currentContributionId" />
                
                <div class="form-group">
                    <label>问题</label>
                    <input type="text" class="form-control" id="modalQuestion" placeholder="问题内容" required>
                </div>
                
                <div class="form-group">
                    <label>答案</label>
                    <textarea class="form-control" id="modalAnswer" rows="5" placeholder="答案内容" required></textarea>
                </div>
                
                <div class="form-group">
                    <label>审核评语</label>
                    <textarea class="form-control" id="modalComment" rows="2" placeholder="输入审核评语（驳回时必填）"></textarea>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn-reject" onclick="submitReview(2)">❌ 驳回</button>
                    <button type="button" class="btn-approve" onclick="submitReview(1)">✅ 通过</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="faqDetailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>FAQ详情 #<span id="faqDetailId">0</span></h3>
                <button class="close-btn" onclick="closeFaqDetailModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>问题</label>
                <input type="text" class="form-control" id="faqDetailQuestion" readonly>
            </div>
            <div class="form-group">
                <label>答案</label>
                <textarea class="form-control" id="faqDetailAnswer" rows="8" readonly></textarea>
            </div>
            <div class="form-group">
                <label>热度分</label>
                <input type="text" class="form-control" id="faqDetailHotScore" readonly>
            </div>
            <div class="form-group">
                <label>今日查询次数</label>
                <input type="text" class="form-control" id="faqDetailQuestionCount" readonly>
            </div>
            <div class="modal-footer">
                <button type="button" class="refresh-btn" onclick="closeFaqDetailModal()">关闭</button>
            </div>
        </div>
    </div>

    <script src="../components/toast.js"></script>
    <script src="../components/menu.js"></script>
    <script src="admin.js"></script>
</body>
</html>
