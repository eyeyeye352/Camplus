<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camplus - 管理员后台</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="background-container">
    <div class="dot dot1"></div><div class="dot dot2"></div><div class="dot dot3"></div>
    <div class="dot dot4"></div><div class="dot dot5"></div><div class="dot dot6"></div>
    <div class="dot dot7"></div><div class="dot dot8"></div><div class="dot dot9"></div>
    <div class="dot dot10"></div><div class="dot dot11"></div><div class="dot dot12"></div>
</div>

<div class="admin-header">
    <div class="admin-title">ADMIN</div>
    <div class="header-right">
        <div class="music-button" id="musicButton">
            <svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
            </svg>
        </div>
        <div class="menu-button" id="menuButton">
            <span></span><span></span><span></span>
        </div>
    </div>
</div>

<div class="admin-sidebar" id="adminSidebar">
    <div class="admin-border-container">
        <div class="admin-border-gradient"></div>
        <div class="admin-border-inner"></div>
    </div>
    <div class="admin-menu-content">
        <div class="admin-menu-item active" id="menuReview" onclick="switchView('review')">贡献审核</div>
        <div class="admin-menu-item" id="menuImport" onclick="switchView('import')">知识导入</div>
        <div class="admin-menu-item logout-item" onclick="window.location.href='/home/index.html'">返回首页</div>
        <div class="admin-menu-item logout-item" onclick="window.location.href='/login/login.html'">退出登录</div>
    </div>
</div>

<div class="main-container">

    <div id="panelReview" class="admin-panel">
        <div class="glass-card">
            <div class="card-header">
                <h2>待审核用户贡献</h2>
                <button class="refresh-btn" onclick="fetchContributions()">刷新数据</button>
            </div>
            <div class="table-wrapper">
                <table id="contributionTable">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>贡献者</th>
                        <th>类型</th>
                        <th>标题</th>
                        <th>提交时间</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="contributionBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="panelImport" class="admin-panel" style="display: none;">
        <div class="glass-card">
            <div class="card-header" style="flex-direction: column; align-items: flex-start; gap: 6px;">
                <h2>多源知识批量导入</h2>
                <p style="color: rgba(255,255,255,0.4); font-size: 13px; margin: 0;">支持拖拽 TXT, CSV, PDF, Word 格式文件，直接交由向量大模型解析入库</p>
            </div>

            <div class="import-container" style="margin-top: 20px; padding: 0; background: transparent; border: none; backdrop-filter: none;">
                <div id="dropZone" class="drop-zone">
                    <div class="drop-icon">📤</div>
                    <p class="drop-text">将你的知识库文件拖拽到此处，或 <span>点击选择文件</span></p>
                    <!-- 移除了 accept 属性，前端不设限 -->
                    <input type="file" id="fileInput" style="display: none;">
                </div>

                <div id="uploadResult" class="upload-result" style="display: none;">
                    <h3 style="color: #40e0d0; margin-bottom: 15px; font-size: 15px;">📦 文件已就绪</h3>
                    <p id="selectedFileInfo" style="color: rgba(255,255,255,0.8); margin-bottom: 20px; font-size: 14px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px;"></p>

                    <button class="btn-approve" id="btnSubmitImport" style="display: block; margin-left: auto;">
                        一键上传并调用大模型解析
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>

<div class="modal-overlay" id="reviewModal">
    <div class="modal-content glass-card">
        <div class="modal-header">
            <h3>处理用户贡献记录 (ID: <span id="modalContributionId"></span>)</h3>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="currentContributionId">
            <input type="hidden" id="currentContributionType">

            <div class="form-group">
                <label>FAQ 归属板块分类</label>
                <select id="modalCategoryId" class="form-control">
                    <option value="1">教务管理</option>
                    <option value="2">校园生活</option>
                    <option value="3">后勤服务</option>
                    <option value="4">IT 技术支持</option>
                </select>
            </div>

            <div class="form-group" id="questionGroup">
                <label>标准问答 - 问题 (Question)</label>
                <input type="text" id="modalQuestion" class="form-control">
            </div>
            <div class="form-group" id="answerGroup">
                <label>标准问答 - 答案 (Answer)</label>
                <textarea id="modalAnswer" class="form-control" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label>补充正文内容 (Content)</label>
                <textarea id="modalContent" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>参考来源 URL</label>
                <input type="text" id="modalSourceUrl" class="form-control">
            </div>

            <div class="form-group">
                <label>管理员审核评语/拒绝理由</label>
                <input type="text" id="modalComment" class="form-control" placeholder="请输入审核备注或驳回意见...">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-reject" onclick="submitReview(2)">拒绝/驳回</button>
            <button class="btn-approve" onclick="submitReview(1)">审核通过(入库)</button>
        </div>
    </div>
</div>

<audio id="bgMusic" loop><source src="../assets/musics/bg.mp3" type="audio/mpeg"></audio>
<script src="admin.js"></script>
</body>
</html>
