<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统日志</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .controls select,
        .controls input {
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .controls select:focus,
        .controls input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.15);
        }

        .controls select option {
            background: #1a1a2e;
            color: #fff;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-refresh {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: #fff;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .log-container {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-container::-webkit-scrollbar {
            width: 6px;
        }

        .log-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .log-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .log-line {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .log-line.error {
            color: #ff6b6b;
        }

        .log-line.warn {
            color: #ffa502;
        }

        .log-line.info {
            color: #7bed9f;
        }

        .log-line.debug {
            color: #5352ed;
        }

        .log-time {
            color: rgba(255, 255, 255, 0.5);
            margin-right: 10px;
        }

        .log-level {
            display: inline-block;
            width: 50px;
            text-align: right;
            margin-right: 10px;
            font-weight: 600;
        }

        .log-message {
            color: rgba(255, 255, 255, 0.9);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 16px;
        }

        .auto-refresh-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .toggle-switch {
            position: relative;
            width: 40px;
            height: 22px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 11px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .toggle-switch.active {
            background: #667eea;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .toggle-switch.active::after {
            transform: translateX(18px);
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>系统日志</h1>
        <div class="controls">
            <select id="logFileSelect">
                <option value="Camplus.log">Camplus.log</option>
            </select>
            <input type="number" id="linesInput" value="100" min="10" max="1000" placeholder="行数">
            <label class="auto-refresh-label">
                <span>自动刷新</span>
                <div class="toggle-switch" id="autoRefreshToggle"></div>
            </label>
            <button class="btn btn-refresh" id="refreshBtn">
                <span id="refreshText">刷新</span>
                <span class="spinner" id="refreshSpinner" style="display: none;"></span>
            </button>
            <button class="btn btn-clear" id="clearBtn">清空</button>
        </div>
    </div>
    <div class="log-container" id="logContainer">
        <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <p>点击刷新查看日志</p>
        </div>
    </div>

    <script>
        const logContainer = document.getElementById('logContainer');
        const logFileSelect = document.getElementById('logFileSelect');
        const linesInput = document.getElementById('linesInput');
        const refreshBtn = document.getElementById('refreshBtn');
        const refreshText = document.getElementById('refreshText');
        const refreshSpinner = document.getElementById('refreshSpinner');
        const clearBtn = document.getElementById('clearBtn');
        const autoRefreshToggle = document.getElementById('autoRefreshToggle');

        let autoRefreshInterval = null;
        let isAutoRefreshEnabled = false;

        async function loadLogFiles() {
            try {
                const response = await fetch('/api/logs/list');
                const result = await response.json();
                if (result.code === 200 && result.data) {
                    logFileSelect.innerHTML = result.data.map(file => 
                        `<option value="${file}">${file}</option>`
                    ).join('');
                }
            } catch (error) {
                console.error('加载日志文件列表失败:', error);
            }
        }

        async function loadLogs() {
            const file = logFileSelect.value;
            const lines = parseInt(linesInput.value) || 100;

            refreshText.style.display = 'none';
            refreshSpinner.style.display = 'inline-block';

            try {
                const response = await fetch(`/api/logs?file=${encodeURIComponent(file)}&lines=${lines}`);
                const result = await response.json();

                if (result.code === 200 && result.data) {
                    displayLogs(result.data);
                } else {
                    logContainer.innerHTML = `<div class="empty-state"><p>${result.message || '暂无日志'}</p></div>`;
                }
            } catch (error) {
                logContainer.innerHTML = `<div class="empty-state"><p>加载日志失败: ${error.message}</p></div>`;
            } finally {
                refreshText.style.display = 'inline-block';
                refreshSpinner.style.display = 'none';
            }
        }

        function displayLogs(lines) {
            if (!lines || lines.length === 0) {
                logContainer.innerHTML = '<div class="empty-state"><p>暂无日志</p></div>';
                return;
            }

            logContainer.innerHTML = lines.map(line => {
                let level = 'info';
                let levelText = '';

                if (line.includes(' ERROR ')) {
                    level = 'error';
                    levelText = 'ERROR';
                } else if (line.includes(' WARN ')) {
                    level = 'warn';
                    levelText = 'WARN';
                } else if (line.includes(' DEBUG ')) {
                    level = 'debug';
                    levelText = 'DEBUG';
                } else if (line.includes(' INFO ')) {
                    level = 'info';
                    levelText = 'INFO';
                }

                return `<div class="log-line ${level}">${escapeHtml(line)}</div>`;
            }).join('');

            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearLogs() {
            logContainer.innerHTML = '<div class="empty-state"><p>日志已清空</p></div>';
        }

        function toggleAutoRefresh() {
            isAutoRefreshEnabled = !isAutoRefreshEnabled;
            autoRefreshToggle.classList.toggle('active', isAutoRefreshEnabled);

            if (isAutoRefreshEnabled) {
                autoRefreshInterval = setInterval(() => {
                    if (document.visibilityState === 'visible') {
                        loadLogs();
                    }
                }, 3000);
            } else {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        refreshBtn.addEventListener('click', loadLogs);
        clearBtn.addEventListener('click', clearLogs);
        autoRefreshToggle.addEventListener('click', toggleAutoRefresh);
        logFileSelect.addEventListener('change', loadLogs);
        linesInput.addEventListener('change', loadLogs);

        loadLogFiles();
        setTimeout(loadLogs, 500);
    </script>
</body>
</html>
