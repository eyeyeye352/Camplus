<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../components/toast.css">
</head>
<body>
<div class="background-container">
    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>
    <div class="dot dot4"></div>
    <div class="dot dot5"></div>
    <div class="dot dot6"></div>
    <div class="dot dot7"></div>
    <div class="dot dot8"></div>
    <div class="dot dot9"></div>
    <div class="dot dot10"></div>
    <div class="dot dot11"></div>
    <div class="dot dot12"></div>
</div>

<div class="login-modal">
    <div class="login-content">
        <h1>忘记密码</h1>

        <form id="forgotPasswordForm">
            <div class="input-group">
                <input type="text" id="email" placeholder="请输入邮箱" required>
            </div>

            <button type="button" class="login-btn" id="verifyEmailBtn">确认邮箱</button>

            <div id="resetFields" style="display: none;">
                <div class="input-group">
                    <input type="password" id="smtpPassword" placeholder="SMTP授权码">
                </div>

                <div class="input-group">
                    <input type="text" id="verificationCode" placeholder="验证码" maxlength="6">
                    <button type="button" class="send-code-btn" id="sendCodeBtn">获取验证码</button>
                </div>

                <div class="input-group">
                    <input type="password" id="newPassword" placeholder="新密码" required>
                </div>

                <button type="submit" class="login-btn">重置密码</button>
            </div>
        </form>

        <div class="back-buttons">
            <p class="back-to-login" id="backToLogin">← 返回登录</p>
        </div>
    </div>
</div>

<script src="../components/toast.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="forgot-password.js"></script>
</body>
</html>
