<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../components/menu.css">
    <link rel="stylesheet" href="../components/toast.css">
</head>
<body>
<!-- 音乐控制按钮 -->
<div class="music-button" id="musicButton">
    <svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
        <line class="music-slash" x1="4" y1="4" x2="20" y2="20" stroke-width="3" style="display: none;"></line>
    </svg>
</div>

<!-- 菜单按钮 -->
<div class="menu-button" id="menuButton">
    <img src="../assets/icons/menuIcon.svg" alt="菜单" class="menu-icon">
</div>

<!-- 背景音乐 -->
<audio id="bgMusic" loop>
    <source src="../assets/musics/webbgm.mp3" type="audio/mpeg">
</audio>

<!-- 侧边菜单 -->
<div class="side-menu" id="sideMenu">
    <div class="menu-header">
        <div class="account-area" id="accountArea">
            <div class="avatar-circle" id="avatarCircle">
                <svg class="avatar-icon avatar-icon--user" id="avatarIconUser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <svg class="avatar-icon avatar-icon--smile" id="avatarIconSmile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
            </div>
            <div class="account-info">
                <span class="account-name" id="accountName">请先登录</span>
                <span class="account-email" id="accountEmail"></span>
            </div>
        </div>
    </div>
    <div class="menu-content">
        <a class="menu-item menu-item--bright" href="../qa/qa.html">
            <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <span>问答平台</span>
        </a>
        <a class="menu-item menu-item--bright" href="../home/index.html">
            <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>首页</span>
        </a>
        <a class="menu-item menu-item--bright" id="adminMenuItem" href="../admin/admin.html">
            <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
            <span>管理者</span>
        </a>
        <a class="menu-item menu-item--bright" href="../contribution/contribution.html">
            <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span>贡献</span>
        </a>
    </div>
</div>

<div class="background-container">
    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>
    <div class="dot dot4"></div>
    <div class="dot dot5"></div>
    <div class="dot dot6"></div>
    <div class="dot dot7"></div>
    <div class="dot dot8"></div>
    <div class="dot dot9"></div>
    <div class="dot dot10"></div>
    <div class="dot dot11"></div>
    <div class="dot dot12"></div>
</div>

<div class="login-modal">
    <div class="login-content" id="loginContent">
        <h1>Camplus</h1>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="loginAccount" placeholder="邮箱/用户名" required>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="密码" required>
            </div>

            <button type="submit" class="login-btn">登入！</button>
        </form>

        <p class="forgot-password">
            <a href="forgot-password.html" id="forgotPasswordLink">忘记密码？</a>
        </p>

        <p class="register-tip">
            没有账号？<a href="#" id="registerLink">注册</a>
        </p>
    </div>

    <div class="register-form-content" id="registerFormContent" style="display: none;">
        <h1>邮箱注册</h1>
        
        <form id="registerForm">
            <div class="input-group">
                <input type="text" id="registerInput" placeholder="请输入邮箱" required>
            </div>

            <div class="input-group" id="verificationCodeGroup">
                <input type="text" id="verificationCode" placeholder="验证码" maxlength="6">
                <button type="button" class="send-code-btn" id="sendCodeBtn">获取验证码</button>
            </div>

            <div class="input-group">
                <input type="password" id="smtpPassword" placeholder="SMTP授权码">
            </div>

            <div class="input-group">
                <input type="password" id="registerPassword" placeholder="密码" required>
            </div>

            <button type="submit" class="login-btn">注册并登入</button>
        </form>
        
        <div class="back-buttons">
            <p class="back-to-login" id="backToLoginFromForm">← 返回登录</p>
        </div>
    </div>
</div>

<script src="../components/toast.js"></script>
<script src="../components/menu.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="login.js"></script>
</body>
</html>
