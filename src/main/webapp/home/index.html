<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camplus</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<!-- 固定标题容器 -->
<div class="fixed-title">
    <h1>Camplus</h1>
</div>

<!-- 音乐控制按钮 -->
<div class="music-button" id="musicButton">
    <svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
        <line class="music-slash" x1="4" y1="4" x2="20" y2="20" stroke-width="3" style="display: none;"></line>
    </svg>
</div>

<!-- 用户按钮 -->
<div class="user-button" id="userButton">
    <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
    </svg>
</div>

<!-- 菜单按钮 -->
<div class="menu-button" id="menuButton">
    <img src="../assets/icons/menuIcon.svg" alt="菜单" class="menu-icon">
</div>

<!-- 背景音乐 -->
<audio id="bgMusic" loop>
    <source src="../assets/musics/webbgm.mp3" type="audio/mpeg">
</audio>

<!-- 菜单遮罩层 -->
<div class="menu-overlay" id="menuOverlay"></div>

<!-- 侧边菜单 -->
<div class="side-menu" id="sideMenu">
    <!-- 边框容器 -->
    <div class="border-container">
        <!-- 彩色渐变边框 -->
        <div class="border-gradient"></div>
        <!-- 内部黑色背景 -->
        <div class="border-inner"></div>
    </div>
    <!-- 菜单内容 -->
    <div class="menu-content">
        <a class="menu-item" href="../qna/qna.html">问答平台</a>
        <a class="menu-item" href="index.html">首页</a>
        <a class="menu-item" href="../user/user.html">用户</a>
        <a class="menu-item" href="../admin/admin.html">管理者入口</a>
        <a class="menu-item" href="../help/help.html">帮助</a>
        <a class="menu-item" href="../contribution/contribution.html">用户贡献</a>
    </div>
    <!-- 底部登录按钮 -->
    <div class="menu-footer">
        <span class="menu-login-btn" id="menuLoginBtn">登入/注册</span>
    </div>
</div>

<!-- 功能按钮容器 -->

<script src="index.js"></script>
</body>
</html>
